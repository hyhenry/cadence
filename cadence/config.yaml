# Shown in Home Assistant (app store, sidebar and the mobile header) as "Calendar".
name: Calendar
version: "0.1.5"
slug: cadence
description: Cadence, a touch-friendly calendar with reminders and Google/Outlook link calendars
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-month
panel_title: Calendar
# Show it in everyone's sidebar, not just administrators'.
panel_admin: false
homeassistant_api: true
homeassistant: "2025.4.0"
backup: hot
